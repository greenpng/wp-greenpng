name: WP integration

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: wp-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wp:
    name: PHP ${{ matrix.php }} · WP ${{ matrix.wp }} · MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The docs/11 cross product on its diagonal budget (ADR-0008).
        # PHP 7.4 is absent here on purpose: wp-env's PHP 7.4 image
        # builds on EOL Debian bullseye whose baked-in apt index now
        # 404s (dpkg-dev), and the failing RUN line lives inside
        # wp-env's generated Dockerfile where no config option can
        # inject an apt-get update. The PHP 7.4 runtime proof runs on
        # the compose floor workflow instead (wordpress:6.0-php7.4,
        # no image build), which executes the same arms in full.
        # The MySQL 5.7 floor proof also runs there: wp-env's config
        # schema has no database version knob.
        include:
          - { php: '8.1', wp: '6.0', mysql: '8' }
          - { php: '8.1', wp: '7.1', mysql: '8' }
          - { php: '8.3', wp: '6.0', mysql: '8' }
          - { php: '8.3', wp: '7.1', mysql: '8' }
    env:
      SITE_URL: http://localhost:8888
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # wp-env mounts local sources under their directory basename, so
      # the plugin must be staged under its real slug for activation,
      # plugin list, and uninstall arms to address "greenpng".
      - name: Stage the plugin under its slug directory
        run: |
          rm -rf .wp-env-plugins
          mkdir -p .wp-env-plugins
          cp -a plugin .wp-env-plugins/greenpng

      - name: Write the wp-env config for this cell
        run: |
          cat > .wp-env.json <<'JSON'
          {
            "core": "https://wordpress.org/wordpress-${{ matrix.wp }}.zip",
            "phpVersion": "${{ matrix.php }}",
            "plugins": ["./.wp-env-plugins/greenpng"]
          }
          JSON

      - name: Start wp-env
        run: |
          # Transient docker-compose failures (image pull contention
          # when many matrix cells start at once) get two retries;
          # a clean stop precedes each attempt.
          for attempt in 1 2 3; do
            if npx wp-env start; then exit 0; fi
            echo "wp-env start failed (attempt ${attempt})"
            npx wp-env stop || true
            sleep 20
          done
          exit 1

      - name: Wait for WordPress
        run: curl --silent --output /dev/null --retry 60 --retry-delay 3 --retry-connrefused "$SITE_URL"

      - name: Integration arms
        run: bash tests/integration/run.sh
        env:
          SITE_URL: ${{ env.SITE_URL }}

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
