name: Static · Security

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: phpcs + PHP 7.4 compat + JS components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v6
        with:
          php-version: '8.3'
          extensions: mbstring, curl
          coverage: none

      - name: Composer dependencies (locked)
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      - name: WordPress coding standard
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: PHP 7.4 compatibility
        run: vendor/bin/phpcs --standard=phpcs-compat.xml.dist --runtime-set testVersion 7.4- plugin/

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS component tests (datagrid XSS acceptance)
        run: node tests/js/gr-datagrid-test.js

  phpstan:
    name: PHPStan level 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v6
        with:
          php-version: '8.3'
          extensions: mbstring, curl
          coverage: none

      - name: Composer dependencies (locked)
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: locked

      # Plain phar invocation: the FrankenPHP argv quirks that force the
      # wrapper script on the dev machine do not exist on stock runners.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
